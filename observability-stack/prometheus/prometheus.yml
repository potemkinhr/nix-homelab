global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: local

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
        labels:
          host: docker
          role: observability

  - job_name: local-node
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          host: docker
          role: observability

  # ==========================================
